name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests and compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q desktop-shell engines model-layer storage

      - name: Run offline test suite
        run: python -m pytest -q

  pylint:
    name: Pylint report (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install lint tooling
        run: python -m pip install --upgrade pip pylint

      - name: Generate Pylint report
        run: |
          pylint $(git ls-files '*.py') --reports=no --output-format=text > pylint-report.txt || true

      - name: Upload Pylint report
        uses: actions/upload-artifact@v4
        with:
          name: pylint-report
          path: pylint-report.txt
